services:
  spring-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    container_name: spring-boot-app
    restart: unless-stopped
    volumes:
      - ./:/app
      - ~/.m2:/root/.m2
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M 